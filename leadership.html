      /* CSS Layout Engine & Design Tokens */
      :root {
        --bg: #0a0a0a;
        --surface: #141414;
        --surface2: #1f1f1f;
        --border: #262626;
        --text: #ffffff;
        --sub: #a3a3a3;
        --red: #cc0020;
        --red-dim: rgba(204, 0, 32, 0.15);
        --purple-dim: rgba(120, 80, 255, 0.15);
        --purple: #a080ff;
        --orange-dim: rgba(245, 158, 11, 0.15);
        --orange: #f59e0b;
        --green-dim: rgba(16, 185, 129, 0.15);
        --green: #10b981;
        --blue-dim: rgba(59, 130, 246, 0.15);
        --blue: #3b82f6;
        --display: "Bebas Neue", sans-serif;
        --body: "Inter", sans-serif;
        --nav-h: 64px;
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--body);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 30px);
      }
      input,
      select,
      textarea,
      button {
        font-family: inherit;
        color: inherit;
      }

      /* Core Layout Shell Components */
      .app-header {
        height: 64px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: var(--bg);
        z-index: 100;
      }
      .app-header-left #viewKicker {
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        color: var(--red);
        letter-spacing: 0.05em;
      }
      .app-header-left #viewTitle {
        font-family: var(--display);
        font-size: 24px;
        line-height: 1;
      }
      .app-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--surface2);
        border: 1px solid var(--border);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .app-main {
        padding-top: 84px;
        padding-inline: 20px;
        max-width: 768px;
        margin: 0 auto;
      }

      /* Design System Layout Elements */
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
        position: relative;
      }
      .card-red {
        border-color: rgba(204, 0, 32, 0.32);
        background: linear-gradient(
          135deg,
          rgba(204, 0, 32, 0.14),
          rgba(28, 28, 28, 0.95)
        );
      }
      .leader-band {
        border: 1px solid rgba(120, 80, 255, 0.25);
        background: rgba(120, 80, 255, 0.08);
      }
      .module-num {
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--sub);
        margin-bottom: 6px;
      }
      .page-subtitle {
        color: var(--sub);
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 20px;
        margin-top: -12px;
      }
      .section-title {
        font-family: var(--body);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--sub);
        margin: 24px 0 12px;
        border-left: 2px solid var(--red);
        padding-left: 8px;
      }

      /* Input Form Components */
      .field {
        margin-bottom: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .field-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        color: var(--sub);
        letter-spacing: 0.05em;
      }
      .field-input {
        background: var(--surface2);
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 8px;
        font-size: 14px;
        width: 100%;
        color: #fff;
      }
      .field-input:focus {
        border-color: var(--red);
        outline: none;
      }
      textarea.field-input {
        min-height: 70px;
        resize: vertical;
      }

      .btn-full {
        display: block;
        width: 100%;
        padding: 14px;
        border-radius: 8px;
        font-weight: 700;
        border: none;
        font-size: 14px;
        text-align: center;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .btn-primary {
        background: var(--red);
        color: white;
      }
      .btn-ghost {
        background: transparent;
        border: 1px solid var(--border);
        color: white;
      }
      .btn-small {
        display: inline-block;
        width: auto;
        padding: 6px 12px;
        font-size: 11px;
        border-radius: 6px;
        cursor: pointer;
        border: none;
        font-weight: 700;
        margin-top: 4px;
      }

      /* Operational Status Badge Elements */
      .badge {
        display: inline-block;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        margin-right: 4px;
        margin-bottom: 4px;
      }
      .bg-green {
        background: var(--green-dim);
        color: var(--green);
      }
      .bg-purple {
        background: var(--purple-dim);
        color: var(--purple);
      }
      .bg-red {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
      }
      .bg-grey {
        background: var(--surface2);
        color: var(--sub);
      }

      /* Reactive Grid Layouts */
      .metrics-row {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 16px;
      }
      .metrics-row.four {
        grid-template-columns: repeat(4, 1fr);
      }
      .metrics-row.five {
        grid-template-columns: repeat(5, 1fr);
      }
      .metric-tile {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        text-align: center;
      }
      .m-val {
        font-family: var(--display);
        font-size: 30px;
        line-height: 1;
        margin-bottom: 2px;
        color: white;
      }
      .m-label {
        font-size: 9px;
        font-weight: 700;
        color: var(--sub);
        text-transform: uppercase;
      }

      /* Mobile Responsive Card Listings */
      .data-card-item {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 10px;
      }
      .data-card-meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 11px;
        color: var(--sub);
        border-top: 1px solid var(--border);
        padding-top: 8px;
        margin-top: 8px;
      }
      .data-card-meta-span {
        background: var(--surface2);
        padding: 2px 6px;
        border-radius: 4px;
      }
      .checkbox-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
      .checkbox-label {
        background: var(--surface2);
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        cursor: pointer;
      }

      .empty-state {
        text-align: center;
        padding: 24px 12px;
        color: var(--sub);
      }
      .empty-state-icon {
        font-size: 24px;
        color: rgba(255, 255, 255, 0.1);
        margin-bottom: 4px;
        display: block;
      }
      .empty-state-text {
        font-size: 12px;
        line-height: 1.4;
      }

      /* Core Navigation Rules */
      .bottom-nav {
        height: calc(var(--nav-h) + var(--safe-bottom));
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 100;
        padding-bottom: var(--safe-bottom);
      }
      .bottom-nav .nav-item {
        flex: 1;
        background: none;
        border: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        color: var(--sub);
        font-size: 9px;
        font-weight: 600;
        height: 100%;
        cursor: pointer;
        position: relative;
        text-decoration: none;
      }
      .bottom-nav .nav-item.active {
        color: white;
      }
      .bottom-nav .nav-icon {
        font-size: 18px;
        line-height: 1;
      }
      .nav-dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--red);
        position: absolute;
        bottom: 6px;
        display: none;
      }
      .bottom-nav .nav-item.active .nav-dot {
        display: block;
      }
      .hidden {
        display: none !important;
      }

    <!-- ================= LOGICAL APPLICATION SCRIPT ENGINE ================= -->
    <script>

          ],
          "Outside Group 3": [
            "PM Tent Support",

            "Old Foyer Cleaning",
            "Old Bathroom Cleaning",
            "Greeting",
            "Tent Cleaning",
            "After-Service Set Down",
            "Wash Lappies",

          ],
        },
      };

      const ROLE_LABELS = {
        trainee: "Trainee Personnel",
        volunteer: "Standard Volunteer",
        group_leader: "Group Leader",
        area_leader: "Area Leader",
        service_leader: "Service Leader",
        ministry_leader: "Ministry Leader",
        pastor: "Ministry Pastor",
      };

      const CLEARANCE_LABELS = {
        trainee: "T1 Clearance — Trainee",
        volunteer: "T2 Clearance — Volunteer",
        group_leader: "T3 Clearance — Group Leader",
        area_leader: "T4 Clearance — Area Leader",
        service_leader: "T5 Clearance — Service Leader",
        ministry_leader: "T6 Clearance — Ministry Leader",
        pastor: "T7 Clearance",
      };

      // Central Datastore Arrays
      let currentUser = null;
      let mohUsers = [];
      let mohResponses = [];
      let mohAssignments = [];
      let mohFeedback = [];
      let mohAlerts = [];
      let mohDelegations = [];
      let mohServingRequests = [];

      // Initialize Page Context
      document.addEventListener("DOMContentLoaded", function () {
        currentUser = getCurrentUser();
        if (!currentUser) {
          window.location.href = "index.html";
          return;
        }

        // 5. Check structural assignment parameters for Weekly Duty Captain delegation state override
        resolveDatastores();

        const role = currentUser.role;
        const isAWeeklyDelegate = hasActiveWeeklyDelegation(currentUser.id);
        const accessAuthorized = isLeader(currentUser) || isAWeeklyDelegate;

        if (!accessAuthorized) {
          document.getElementById("roleViewCanvas").innerHTML = `
          <div class="card card-red" style="text-align:center; padding:40px 20px;">
            <h2 style="font-family:var(--display); font-size:32px;">Access Denied</h2>
            <p class="field-note" style="font-size:14px; margin-top:8px;">Leadership access only. Your profile does not permit this view.</p>
          </div>`;
          return;
        }

        // The leadership PIN was removed in v13 (shared plaintext PINs in a
        // client-readable file). Roles + RLS replace it, so this gate is gone.
        if (false) {
          renderLeadershipPinGate(isAWeeklyDelegate);
          return;
        }

        renderGlobalHeader(isAWeeklyDelegate);
        renderDynamicMenu(isAWeeklyDelegate);
        renderConsoleBody(isAWeeklyDelegate);

        // Pull live data as soon as the Supabase client exists, re-render, and
        // then keep re-rendering whenever anything relevant changes.
        const goLive = async () => {
          const ok = await loadLiveData();
          if (!ok) return;
          renderConsoleBody(isAWeeklyDelegate);
          showDataBanner();

          if (window.MOHData.onChange) {
            window.MOHData.onChange(
              [
                "serving_stats",
                "duty_assignment",
                "user_info",
                "feedback",
                "group_area_assignment",
                "group_placement",
              ],
              async () => {
                await loadLiveData();
                renderConsoleBody(isAWeeklyDelegate);
                showDataBanner();
              },
            );
          }
        };

        if (window.supabaseClient) goLive();
        else window.addEventListener("supabase-ready", goLive, { once: true });
      });

      function showDataBanner() {
        let el = document.getElementById("liveBanner");
        if (!el) {
          el = document.createElement("div");
          el.id = "liveBanner";
          const host = document.getElementById("leadershipHeaderContainer");
          if (host) host.prepend(el);
        }
        const live = dataSource === "live";
        el.className = "data-note" + (live ? " live" : "");
        el.innerHTML = live
          ? "\u25CF Live \u2014 updates as your team responds."
          : "Showing cached data \u2014 couldn't reach the server.";
        el.style.display = live ? "block" : "block";
      }

      // ================= 5. SHARED CORE STORAGE IMPLEMENTATION HELPER FUNCTIONS =================
      function getCurrentUser() {
        const read = (k) => {
          try {
            return JSON.parse(localStorage.getItem(k));
          } catch {
            return null;
          }
        };
        // Current session (written by App.cacheSession since v13).
        const phone = localStorage.getItem("moh_user_session");
        const users = read("moh_users") || [];
        if (phone) {
          const me = users.find((u) => String(u.phone) === String(phone));
          if (me) return me;
        }
        if (users.length === 1) return users[0];
        // Legacy keys, kept so an old session still opens.
        return (
          read("currentUser") ||
          read("crc_moh_current_user") ||
          read("crc_moh_user") ||
          read("crc_moh_user_v2") ||
          null
        );
      }

      // ================= LIVE DATA =================
      // Was: parse six localStorage keys. localStorage is per-device, so every
      // console only ever saw people who had signed in on this machine.
      // Now: one call into MOHData, which reads Supabase and falls back to the
      // local cache. The variable shapes are unchanged, so the five consoles
      // below did not need rewriting.
      let dataSource = "local";

      // serving_stats uses am/pm/both/none; the consoles expect serving_*.
      function mapServingToResponse(v) {
        return (
          {
            am: "serving_am",
            pm: "serving_pm",
            both: "serving_both",
            none: "not_serving",
          }[v] || null
        );
      }

      async function loadLiveData() {
        if (!window.MOHData || !window.supabaseClient) return false;
        try {
          const view = await window.MOHData.teamOverview(currentUser);
          const assigned = await window.MOHData.assignments(view.date);

          mohUsers = view.members;
          mohResponses = view.members
            .filter((m) => m.serving)
            .map((m) => ({
              userId: m.id,
              response: mapServingToResponse(m.serving),
              requestId: "req_sunday",
              date: view.date,
            }));
          mohAssignments = assigned.data;

          const fb = await window.MOHData.feedback(currentUser);
          mohFeedback = (fb.data || []).map((f) => ({
            id: f.feedback_id,
            userId: f.user_id,
            title: f.title,
            category: f.category,
            location: f.location,
            urgency: f.urgency_level,
            description: f.description,
            resolved: f.is_resolved,
            createdAt: f.date_time_logged,
          }));

          mohServingRequests = [
            { id: "req_sunday", title: "Sunday Service", date: view.date, status: "open" },
          ];
          mohAlerts = JSON.parse(localStorage.getItem("mohAlerts")) || [];

      function bindLeadershipNavChrome() {
        const nav = document.getElementById("sideNav");
        const scrim = document.getElementById("navScrim");
        const toggle = document.getElementById("navToggle");
        if (!nav || !scrim || !toggle || toggle.dataset.bound) return;
        toggle.dataset.bound = "1";
        const setOpen = (open) => {
          nav.classList.toggle("open", open);
          scrim.classList.toggle("open", open);
          toggle.classList.toggle("is-open", open);
          toggle.setAttribute("aria-expanded", open ? "true" : "false");
          document.body.classList.toggle("nav-open", open);
        };
        toggle.onclick = () => setOpen(!nav.classList.contains("open"));
        scrim.onclick = () => setOpen(false);
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") setOpen(false);
        });

        handleGlobalMessage(e) {
          e.preventDefault();
          const title = document.getElementById("pastorTitle").value;
          const msg = document.getElementById("pastorMsg").value;

          mohUsers.forEach((u) => {
            createAlert({
              title: `👑 Pastoral Proclamation: ${title}`,
              message: msg,
              type: "system",
              priority: "critical",
              userId: u.id,
            });
          });

          alert(
            "Master pastoral briefing package distributed across system nodes.",
          );
          document.getElementById("pastorTitle").value = "";
          document.getElementById("pastorMsg").value = "";
        },
      };
    </script>
  </body>
</html>
